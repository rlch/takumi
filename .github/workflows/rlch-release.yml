# rlch fork: build the packages schools-ts installs and attach them, as npm
# tarballs, to a GitHub Release. Nothing is published to npm. The build steps
# are ci.yml's, job for job; see FORK.md for what differs and why.
name: rlch release

on:
  push:
    tags: ["v*-rlch.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  RUSTFLAGS: >-
    --remap-path-prefix=/home/runner=~
    --remap-path-prefix=/Users/runner=~
    --remap-path-prefix=/root=~
    --remap-path-prefix=$HOME/.cargo/registry=~/.cargo/registry
    --remap-path-prefix=$HOME/.rustup=~/.rustup
  TAG: ${{ github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-helpers:
    name: Build @takumi-rs/helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter ./takumi-helpers

      - name: Build helpers
        working-directory: takumi-helpers
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist
          if-no-files-found: error

  # The targets schools-ts runs on: the render image (linux/amd64 and
  # linux/arm64, Debian bookworm) and a developer's Mac. Add a row here to ship
  # another; the pack step reads the targets from the artifacts.
  build-napi:
    needs: build-helpers
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15
            target: aarch64-apple-darwin
            build: bun run build --target aarch64-apple-darwin
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build: bun run build --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: bun run build --target x86_64-unknown-linux-gnu --use-napi-cross
    name: Build @takumi-rs/core for ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly-2026-08-05
          targets: ${{ matrix.settings.target }}
          components: rust-src
          stage: build

      - name: Download helpers artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter ./takumi-napi

      # napi bakes the package version into its loader, which compares it with
      # the platform package's.
      - name: Version
        run: bash scripts/rlch-version.sh "$TAG"

      - name: Build
        working-directory: takumi-napi
        env:
          CARGO_UNSTABLE_BUILD_STD: std
          CARGO_UNSTABLE_BUILD_STD_FEATURES: optimize_for_size
          CARGO_PROFILE_RELEASE_PANIC: unwind
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -Zunstable-options
        run: ${{ matrix.settings.build }} -- --locked && bun build:js

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            takumi-napi/dist
            takumi-napi/core.*.node
            takumi-napi/index.js
            takumi-napi/index.d.ts
          if-no-files-found: error

      - name: Test bindings
        working-directory: takumi-napi
        run: bun test

  build-wasm:
    name: Build @takumi-rs/wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly-2026-08-05
          targets: wasm32-unknown-unknown
          components: rust-src
          stage: build

      - name: Install wasm-pack
        uses: ./.github/actions/setup-wasm-pack

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter ./takumi-wasm

      - name: Build WASM
        working-directory: takumi-wasm
        env:
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
          CARGO_UNSTABLE_BUILD_STD_FEATURES: optimize_for_size
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -Zunstable-options -Cpanic=immediate-abort -Ctarget-feature=+simd128
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-package
          path: |
            takumi-wasm/pkg/takumi_wasm.d.ts
            takumi-wasm/pkg/takumi_wasm.js
            takumi-wasm/pkg/takumi_wasm_bg.wasm
            takumi-wasm/pkg/takumi_wasm_bg.wasm.d.ts
            takumi-wasm/dist
          if-no-files-found: error

  # Built for speed (takumi-pdf-js/speed.toml): std is not size-optimized either,
  # and upstream's 2 MiB Worker ceiling is reported, not enforced.
  build-pdf-wasm:
    name: Build takumi-pdf
    runs-on: ubuntu-latest
    needs: build-helpers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly-2026-08-05
          targets: wasm32-unknown-unknown
          components: rust-src
          stage: build

      - name: Install wasm-pack
        uses: ./.github/actions/setup-wasm-pack

      - name: Download helpers artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter ./takumi-pdf-js

      - name: Build takumi-pdf
        working-directory: takumi-pdf-js
        env:
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -Zunstable-options -Cpanic=immediate-abort -Ctarget-feature=+simd128
        run: bun run build

      - name: Report wasm size
        working-directory: takumi-pdf-js
        run: |
          wasm=pkg/takumi_pdf_wasm_bg.wasm
          echo "takumi-pdf wasm: $(wc -c < "$wasm") bytes, $(gzip -9 -c "$wasm" | wc -c) gzip" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test takumi-pdf
        working-directory: takumi-pdf-js
        run: bun test

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-package
          path: |
            takumi-pdf-js/pkg/takumi_pdf_wasm.d.ts
            takumi-pdf-js/pkg/takumi_pdf_wasm.js
            takumi-pdf-js/pkg/takumi_pdf_wasm_bg.wasm
            takumi-pdf-js/pkg/takumi_pdf_wasm_bg.wasm.d.ts
            takumi-pdf-js/dist
          if-no-files-found: error

  build-js:
    name: Build takumi-js
    runs-on: ubuntu-latest
    needs: [build-helpers, build-napi, build-wasm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download helpers artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist

      - name: Download N-API bindings artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: takumi-napi

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package
          path: takumi-wasm

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter ./takumi-js

      - name: Build takumi-js
        working-directory: takumi-js
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-dist
          path: takumi-js/dist
          if-no-files-found: error

  release:
    name: Pack and release
    runs-on: ubuntu-latest
    needs: [build-helpers, build-napi, build-wasm, build-pdf-wasm, build-js]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download helpers artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist

      - name: Download all napi artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bindings-*
          path: takumi-napi/artifacts

      - name: Download N-API bindings artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: takumi-napi

      - name: Download takumi-js artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-dist
          path: takumi-js/dist

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package
          path: takumi-wasm

      - name: Download PDF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pdf-package
          path: takumi-pdf-js

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack
        run: bash scripts/rlch-pack.sh "$TAG" release

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Packages schools-ts installs, built from \`${GITHUB_SHA}\` on the \`rlch\` branch (FORK.md)."
            echo
            echo '| asset | sha512 (npm integrity) |'
            echo '| --- | --- |'
            for f in release/*.tgz; do
              echo "| $(basename "$f") | sha512-$(openssl dgst -sha512 -binary "$f" | base64 -w0) |"
            done
          } > notes.md
          gh release create "$TAG" release/*.tgz --title "$TAG" --notes-file notes.md --prerelease --verify-tag
